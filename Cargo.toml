[package]
name = "resampleos"
version = "0.3.5"
edition = "2024"
description = "A resample-first pad DAW: commit to audio, capture everything, resample it again."
readme = "README.md"
license = "MIT"
keywords = ["daw", "sampler", "audio", "music", "vst3"]
categories = ["multimedia::audio"]

[dependencies]
clap-sys = "0.5.0"
cpal = "0.18.2"
eframe = "0.36.2"
hound = "3.5.1"
libloading = "0.9.0"
midir = "0.11.1"
midly = "0.5"
rfd = "0.17.2"
rtrb = "0.4.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aiff", "pcm"] }
vst3-host = { version = "0.10.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Audio code is unusable unoptimised, so even debug builds get some optimisation, and the
# dependencies (DSP, decoding, rendering) are always built fully optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# egui's own debug checks trip on textured rects in debug builds (not in release).
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1

# vst3-host with two fixes for plugin editors that show metering. See vendor/README.md.
[patch.crates-io]
vst3-host = { path = "vendor/vst3-host" }
